[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.13.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/oops-rs/senate"

# Every version is chosen once, here. A member names what it uses with
# `workspace = true`.
[workspace.dependencies]
# Members, bottom of the stack first.
senate-observe = { path = "crates/senate-observe", version = "0.13.1" }
senate-observe-client = { path = "crates/senate-observe-client", version = "0.13.1" }
senate-observe-protocol = { path = "crates/senate-observe-protocol", version = "0.13.1" }
senate-scene = { path = "crates/senate-scene", version = "0.13.1" }
senate-core = { path = "crates/senate-core", version = "0.13.1" }
senate-markdown = { path = "crates/senate-markdown", version = "0.13.1" }
senate-log = { path = "crates/senate-log", version = "0.13.1" }
senate-server = { path = "crates/senate-server", version = "0.13.1" }
senate-work = { path = "crates/senate-work", version = "0.13.1" }
senate-speaker = { path = "crates/senate-speaker", version = "0.13.1" }
senate-remote-admin = { path = "crates/senate-remote-admin", version = "0.13.1" }
senate-bridge = { path = "crates/senate-bridge", version = "0.13.1", default-features = false }
senate-app-core = { path = "crates/senate-app-core", version = "0.13.1" }
senated = { path = "crates/senated", version = "0.13.1" }
senate-e2e = { path = "crates/senate-e2e" }

# The agent harness behind the built-in Speaker. basis re-exports every
# mentra type a host must name, so this is the only harness dependency.
basis = "0.27.2"
# Scripted providers for Speaker tests, matching the mentra basis resolves.
mentra = { version = "0.38.1", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.3", features = ["chrono04"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
# A committee's timezone, by its IANA name (the Speaker's daily digest).
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
# Features are chosen by each member: the contracts need only `sync`.
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures = "0.3"
bytes = "1"

# The server's supervision tree.
ractor = "0.16.5"

toml = "0.8"
# Bridge `install`: edits ~/.codex/config.toml keeping its comments and order.
toml_edit = "0.22"
anyhow = "1"
sha2 = "0.10"
subtle = "2"
hex = "0.4"

# The log: Postgres on a server, SQLite on a developer machine.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
rusqlite = { version = "0.39", features = ["bundled"] }

# HTTP: server API + SSE, bridge client.
axum = { version = "0.8", features = ["macros", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
eventsource-stream = "0.2"

# Bridge: MCP tools over stdio, local state.
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
dirs = "6"
libc = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
pty-process = { version = "0.5.4", features = ["async"] }
vt100 = "0.18.1"
rustix = { version = "1.1.6", features = ["fs", "process", "termios", "time"] }

# CLI and logging.
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "=4.6.12", features = ["unstable-dynamic"] }
strsim = "0.11"
terminal_size = "0.4"
comrak = { version = "=1.2.0", default-features = false }
unicode-segmentation = "1.13"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The native apps' shared core (crates/senate-app-core): Swift bindings
# over UniFFI. Pinned exactly: the generated Swift and the scaffolding must
# come from the same version.
uniffi = "=0.32.2"

# Tests.
tempfile = "3"

# Debug builds and tests keep line tables for the workspace's own crates: a
# backtrace and a panic still name the file and line, and a dependency's
# frames still show by name. Full debug info (every variable and type, for
# a debugger) is what filled target/: a workspace test build was 22 GB with
# it. For a session in a debugger: CARGO_PROFILE_DEV_DEBUG=2 on the command.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The benchmark fixture's build (scripts/perf): optimised as a release is,
# with debug assertions on, since an unsigned daemon takes a person's
# requests only as a debug fixture confined to a temp home, and with line
# tables so a profiler names source lines.
[profile.perf]
inherits = "release"
debug-assertions = true
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
