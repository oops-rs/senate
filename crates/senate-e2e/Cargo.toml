[package]
name = "senate-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "End-to-end tests: the real server, Speaker and bridge daemons, assembled by senated, against a generic fake chat platform."

# Build the bridge CLI entry point under a distinct name so Cargo supplies
# its exact path to tests without colliding with senate-bridge's binary.
[[bin]]
name = "senate-e2e-cli"
path = "../senate-bridge/src/main.rs"
test = false
bench = false

[dependencies]
senate-bridge = { workspace = true }

[dev-dependencies]
senate-core = { workspace = true }
senate-log = { workspace = true }
senate-server = { workspace = true }
senate-speaker = { workspace = true }
senate-work = { workspace = true, features = ["testing"] }
senated = { workspace = true, features = ["testing"] }
chrono = { workspace = true }
ractor = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[lints]
workspace = true
