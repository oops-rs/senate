[package]
name = "senate-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "End-to-end tests: the real server, Speaker and bridge daemons, assembled by senated, against a generic fake chat platform."

[dependencies]

[dev-dependencies]
senate-core = { workspace = true }
