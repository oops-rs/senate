[package]
name = "senate-speaker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The built-in Speaker: presides over the top Senate on basis. Understands what people ask it in chat, relays, mirrors, triages, answers for absent agents, and does coding work on request."

[dependencies]
senate-core = { workspace = true }
senate-work = { workspace = true }
async-trait = { workspace = true }
basis = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
ractor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
senate-work = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
