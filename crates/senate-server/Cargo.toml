[package]
name = "senate-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Senate server: supervision tree over the log, HTTP/SSE API for bridges, authentication and roster seams, and the Hub for in-process components."

[dependencies]
senate-observe.workspace = true
senate-observe-protocol.workspace = true
senate-core = { workspace = true }
senate-log = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
ractor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tempfile = { workspace = true }
eventsource-stream = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }

[lints]
workspace = true
