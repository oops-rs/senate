[package]
name = "senate-app-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The shared core of the native Senate apps: a client of the developer-machine daemon, exposed to Swift over UniFFI."

[lib]
name = "senate_app_core"
# `lib` for the tests and the example, `staticlib` for the Xcode app.
crate-type = ["lib", "staticlib"]

[[bin]]
# Generates the Swift bindings from the built library
# (apps/macos/scripts/build-core.sh); not part of a normal build.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
senate-bridge = { workspace = true }
senate-core = { workspace = true }
senate-markdown = { workspace = true }
senate-observe = { workspace = true }
senate-observe-protocol = { workspace = true }
senate-scene = { workspace = true }
uniffi = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
# The unified-log shim (src/oslog/shim.c), on macOS.
cc = "1"

[dev-dependencies]
axum = { workspace = true }
# The fake daemon refuses what a signed daemon refuses: a request that did
# not go through `ipc::request_line` (tests/support/common.rs).
senate-bridge = { workspace = true, features = ["fake-proofs"] }
senate-observe = { workspace = true, features = ["replay"] }
tempfile = { workspace = true }

[lints]
workspace = true
