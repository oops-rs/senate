[package]
name = "senate-work"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Speaker's hands: a Runner that does coding work on a Speaker branch (Claude Code headless in Docker) and a Forge that opens the PR (gh)."

[features]
# FakeRunner / FakeForge for the Speaker's tests and the e2e suite.
testing = []

[dependencies]
senate-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time", "fs", "sync", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
