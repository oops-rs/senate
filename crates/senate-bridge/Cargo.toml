[package]
name = "senate-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The developer-machine side of Senate: one daemon per machine seating a person's coding agents on committee logs."

[[bin]]
name = "senate-bridge"
path = "src/main.rs"

[dependencies]
senate-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "fs", "io-util"] }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
# No `preserve_order`: it would change map order for every crate built with
# this one. `install` keeps settings.json's key order itself.
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
