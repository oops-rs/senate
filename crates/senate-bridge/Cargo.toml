[package]
name = "senate-bridge"
# Ahead of the workspace: 0.1.1 adds `senate_bridge::cli`, which the `senate`
# package (shim/senate) needs from the registry.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The developer-machine side of Senate: sessions, delivery, MCP tools and hooks for a person's coding agents, across every Senate the machine serves; and the `senate` command."

# The `senate` command for people and agents on a developer machine:
# install, status, inbox, take, init, and the MCP server and hooks that
# Claude Code and Codex run. The daemon is `senated`.
[[bin]]
name = "senate"
path = "src/main.rs"

[dependencies]
senate-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "fs", "io-util"] }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
pty-process = { workspace = true }
vt100 = { workspace = true }
rustix = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
terminal_size = { workspace = true }
textwrap = { workspace = true }
serde = { workspace = true }
# No `preserve_order`: it would change map order for every crate built with
# this one. `install` keeps settings.json's key order itself.
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }

[lints]
workspace = true
