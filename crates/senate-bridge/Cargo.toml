[package]
name = "senate-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The developer-machine side of Senate: sessions, delivery, MCP tools and hooks for a person's coding agents, across every Senate the machine serves; and the `senate` command."

# The `senate` command for people and agents on a developer machine:
# install, status, inbox, take, init, and the MCP server and hooks that
# Claude Code and Codex run. The daemon is `senated`.
[[bin]]
name = "senate"
path = "src/main.rs"

[features]
default = ["observe-cli"]
observe-cli = ["dep:axum", "dep:senate-observe-client", "senate-observe/replay"]

[dependencies]
axum = { workspace = true, optional = true }
senate-observe-client = { workspace = true, optional = true }
senate-observe.workspace = true
senate-observe-protocol.workspace = true
senate-scene.workspace = true
senate-remote-admin.workspace = true
senate-core = { workspace = true }
senate-markdown = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "fs", "io-util"] }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
dirs = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
pty-process = { workspace = true }
vt100 = { workspace = true }
rustix = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
strsim = { workspace = true }
terminal_size = { workspace = true }
textwrap = { workspace = true }
unicode-width = "0.2"
serde = { workspace = true }
# No `preserve_order`: it would change map order for every crate built with
# this one. `install` keeps settings.json's key order itself.
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

base64 = "0.22"
getrandom = "0.4"
subtle = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

[build-dependencies]
cc = "1"

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }

[lints]
workspace = true
