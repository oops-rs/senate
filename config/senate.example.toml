# A developer machine under a team's Senate. Copy to ~/.senate/senate.toml
# (or $SENATE_HOME/senate.toml) and keep it private: chmod 600. Then:
#
#   senate setup install --yes     # once: the MCP server and hooks for Claude Code / Codex
#   senated --machine        # the daemon
#   senate status
#
# (A file named bridge.toml there is read the same way while senate.toml
# does not exist.)

# The team's Senate (its senated). As shipped this machine hosts no Senate
# of its own: its agents are seated there directly, and it only makes
# outbound requests to it. With [local] (at the end of this file) it hosts
# its own Senate under the team's instead: see there.
server_url = "https://senate.example.com"

# Your token, as issued by whoever runs the server. It names you, a person,
# to the server; your coding agents then act under your name.
token = "replace-me"

# Your handle. Must be the person the token names; the daemon refuses to
# start otherwise. Every agent this machine runs is yours, seated in the
# team's Senate under one flat name: a Claude Code session as `claude`, a
# Codex session as `codex` (see [agents] below). Names are unique within a
# Senate: if a teammate already runs `claude` there, pick another.
person = "alice"

# Optional: the language of everything the bridge writes for you and your
# agents, "en" or "zh". Identifiers (addresses, kinds, tool names) are the
# same in both. Default "en".
# locale = "en"

# Optional: committees whose stream stays open for this machine's agents
# even with no session bound to them, so directed messages are queued for
# your next session instead of waiting until one joins. A session binds
# itself to a committee from the `join` tool (this session only), a
# `<branch_prefix>/<committee>/<person>` branch (only with
# `committee_from_branch` below), or the worktree's `.senate/committee`
# (`senate join <committee>` writes it; it is untracked and kept per branch
# under ~/.senate/branches/, so switching branches swaps in that branch's
# own copy). `senate where` shows what a directory resolves to.
# committees = ["refund-v2"]

# Optional: the most characters of the committee brief (decisions in force,
# open questions, latest checkpoints, presence) injected when a session
# starts, ahead of any messages waiting for it. 0 injects none. The brief is
# also readable at any time as the MCP resource senate://<committee>/brief.
# brief_chars = 6000

# Optional: bind a session to the committee its branch is named for,
# `<branch_prefix>/<committee>/<person>`, ahead of `.senate/committee`. Off
# by default: a branch name is other tools' business too, and
# `branch_prefix` alone does not turn this on.
# committee_from_branch = true

# Optional: `senate setup clean` forgets the queued items and cursors of an agent
# with no session and no contact for this many days. Default 30.
# free_after_days = 30

# Optional maximum for running and starting Senate-hosted sessions on
# this machine. Absent (the default): no limit. Set it to 0 to disable
# spawn and restore.
# hosted_session_limit = 4

# Optional: the first segment of a developer branch,
# `<branch_prefix>/<committee>/<person>`: what `committee_from_branch`
# reads, and how the Speaker names its work branches. Default "feature".
# branch_prefix = "feature"

# Checkpoints need no configuration. The agent keeps
# .senate/{PROGRESS,DECISIONS,OPEN}.md in the worktree with the `checkpoint`
# tool; the bridge sends them with the branch and commit on that tool, on a
# hand-off, on a new commit on a bound session's branch, at session end and
# every 2 h of an open session. It never pushes your branch unless asked
# (`checkpoint(push=true)` or a hand-off).

# Optional: the agent each kind of coding session speaks as: one flat name
# (no path). A session can pin another with SENATE_AGENT in its environment
# (Claude Code only) or a `.senate/agent` file in its worktree. These are
# the defaults.
# [agents]
# claude = "claude"
# codex = "codex"

# Optional: how the bridge reaches Codex sessions (`codex --remote unix://`
# attached to the managed app-server, `codex app-server daemon start`). By
# default it runs `codex app-server proxy`, which finds the managed daemon's
# control socket itself; `listen` names an app-server socket directly, and
# `bin` the codex CLI to run the proxy with. Claude Code sessions do not use
# this.
# [codex]
# listen = "unix:///Users/alice/.codex/app-server-control/app-server-control.sock"
# bin = "/opt/homebrew/bin/codex"

# Optional, off by default: the companion session (it spends your own model
# budget). When a question reaches your agent and you have no Claude Code
# session open on its committee (or none active for idle_secs), the bridge
# runs a headless fork of your latest session there
# (`claude -p --resume <id> --fork-session`) with read-only tools plus the
# answer, catch_up and search tools; it answers, labelled as the companion,
# and exits. Requests are never given to it. One runs at a time and is
# killed after max_secs.
# [companion]
# enabled = true
# claude_bin = "/opt/homebrew/bin/claude"   # default: `claude` on PATH
# max_secs = 300
# idle_secs = 1800

# Desktop notification when something is addressed to you (an answer, a note,
# an escalation): one per burst, skipped while the desktop app is open.
# [notify]
# desktop = false   # default true

# Optional: a machine under a parent. With [local], this machine hosts its
# own Senate (`senated --machine`, on loopback, its log under
# senates/top/) and registers it with the team's Senate above as a child,
# authenticated with your token there. Your agents sit in your Senate, not
# in the team's; the team reaches your desk as
# `<name>::<committee>::speaker` (`alice-desk::refund-v2::speaker`), and
# you reach the team's seats by their qualified names
# (`senate ask /acme::ibot::bob`). `senate status` shows the full path
# (`/acme/alice-desk`), the parent and whether the registration was taken.
# [local]
# name = "alice-desk"                     # default: <person>-desk
# Its Speaker is you, as a senator of the Senate above (the default). The
# path must be the parent's; an agent of the Senate above as the Speaker is
# not supported yet.
# speaker = "/acme::senator::alice"
# Who works your desk while you are away, in order (the first present acts):
# your agents here, or the built-in secretary by its name (secretary.toml).
# secretaries = ["claude"]
# listen = "127.0.0.1:7979"               # loopback only
