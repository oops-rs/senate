# The Senate macOS app. Generate the Xcode project with `xcodegen generate`
# (Senate.xcodeproj is generated, not checked in). See README.md.
name: Senate
options:
  bundleIdPrefix: dev.senate
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    # The app's version: the workspace's (Cargo.toml `[workspace.package]
    # version`). scripts/build-core.sh fails the build when they differ.
    MARKETING_VERSION: "0.12.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # The pre-build phase writes into the source tree (Generated/).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  # The Rust core's UniFFI bindings, as their own module. Kept apart from
  # the app because the app's code is MainActor by default and the bindings
  # are called on the core's threads. This module is the app's one door to
  # the daemon.
  SenateCore:
    type: framework.static
    platform: macOS
    sources:
      # Written by scripts/build-core.sh (the pre-build phase), so it may
      # be missing when the project is generated.
      - path: Generated/senate_app_core.swift
        optional: true
        group: Generated
    preBuildScripts:
      - name: Build Rust core
        script: |
          "$PROJECT_DIR/scripts/build-core.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Generated/libsenate_app_core.a
          - $(PROJECT_DIR)/Generated/senate_app_core.swift
          - $(PROJECT_DIR)/Generated/senate_app_coreFFI.h
    settings:
      base:
        PRODUCT_NAME: SenateCore
        PRODUCT_BUNDLE_IDENTIFIER: dev.senate.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # The C side, as the clang module the bindings import.
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(PROJECT_DIR)/Generated/senate_app_coreFFI.modulemap
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
  Senate:
    type: application
    platform: macOS
    dependencies:
      - target: SenateCore
    sources:
      - path: Senate
        excludes:
          - Info.plist
          - Senate.entitlements
    info:
      path: Senate/Info.plist
      properties:
        CFBundleDisplayName: Senate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages the app is written in; the system language picks one
        # and English is the fallback.
        CFBundleLocalizations:
          - en
          - zh-Hans
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        # Starts as a menu-bar app: the setting "Show in Dock" (on by default)
        # makes it a regular app before it finishes launching (Dock.swift),
        # so with it off no Dock icon ever flashes.
        LSUIElement: true
        NSAppleEventsUsageDescription: Senate opens Codex and hosted sessions in Terminal.
        # `senate://open/v1/…` links (LinkRouter.swift). The scheme is a
        # build setting: `senate` for Release only. A Debug build registers
        # `senate-debug` instead (read as `senate` by a Debug build alone),
        # so building or running one never takes `senate://` from the
        # installed app; its UI test opens `senate-debug://` links.
        CFBundleURLTypes:
          - CFBundleURLName: dev.senate.app.link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - $(SENATE_URL_SCHEME)
        NSHumanReadableCopyright: MIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senate.app
        PRODUCT_NAME: Senate
        SENATE_URL_SCHEME: senate
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app's own code runs on the main actor unless it says otherwise.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(PROJECT_DIR)/Generated/senate_app_coreFFI.modulemap
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Generated
        # What the Rust static library needs from the system
        # (`cargo rustc --print native-static-libs`).
        OTHER_LDFLAGS: -lsenate_app_core -liconv -framework CoreFoundation -framework Security -framework SystemConfiguration -framework ApplicationServices
        # Hardened runtime with one entitlement (Apple Events, for Terminal);
        # no App Sandbox: the daemon's unix socket lives in ~/.senate.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Senate/Senate.entitlements
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          SENATE_URL_SCHEME: senate-debug
  # The store and view models against a fake core (Swift Testing), hosted
  # by the app (which connects to nothing under test).
  SenateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SenateTests
        # The fixture scene: read by the tests from the source tree.
        excludes:
          - Fixtures/**
    dependencies:
      - target: Senate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senate.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Senate.app/Contents/MacOS/Senate
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(PROJECT_DIR)/Generated/senate_app_coreFFI.modulemap
  # A smoke run of the real app against the core's fake daemon
  # (scripts/ui-test.sh starts it).
  SenateUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SenateUITests
    dependencies:
      - target: Senate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.senate.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Senate
        # XCTestCase's overrides are nonisolated while XCUIApplication is
        # the main actor's: the UI tests stay in the Swift 5 language mode.
        SWIFT_VERSION: "5.0"
schemes:
  Senate:
    build:
      targets:
        Senate: all
    run:
      config: Debug
    test:
      config: Debug
      captureScreenshotsAutomatically: false
      targets:
        - SenateTests
        - SenateUITests
    archive:
      config: Release
